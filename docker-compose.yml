name: example
services:
  postgres:
    image: postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: example_dev
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example_local_only
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U example -d example']
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  # Postgres 18 (new data layout): a new volume, so an old local Postgres 16 volume is not reused.
  pgdata18:
