name: Purge test data
# Deletes test orders, customer photos, Stripe events, order emails and rate limits after a database dump.
# Keeps content, prices, settings, legal pages, production breaks and accounts. Refused once the site is open.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Saisir PURGER pour confirmer
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false
jobs:
  purge:
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PURGE_CONFIRMATION: ${{ inputs.confirmation }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Back up the database, then purge test orders
        run: python3 deploy/purge_test_data.py
