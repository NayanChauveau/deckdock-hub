name: Deploy production
on:
  push:
    branches: [main]
    # Documentation alone deploys nothing (GitHub Actions minutes count); the next push checks it.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      # The images tested by ci.yml are the ones published, then deployed.
      publish: ${{ github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
  deploy:
    # Explicit opt-in repository variable; adding these files cannot deploy by itself.
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      WEB_IMAGE: ${{ needs.ci.outputs.image }}
      OPS_IMAGE: ${{ needs.ci.outputs.ops }}
      TRAEFIK_HOST: ${{ vars.PRODUCTION_HOST }}
      TRAEFIK_ALIASES: ${{ vars.PRODUCTION_ALIASES }}
      PUBLIC_INDEXING: ${{ vars.PUBLIC_INDEXING || 'false' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      STRIPE_MODE: ${{ vars.STRIPE_MODE || 'test' }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
      STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
      EMAIL_MODE: ${{ vars.EMAIL_MODE || 'simulated' }}
      SMTP_URL: ${{ secrets.SMTP_URL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
      BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate settings before any production write
        run: python3 deploy/preflight.py
      - name: Deploy exact release through SSH
        run: python3 deploy/dispatch.py
