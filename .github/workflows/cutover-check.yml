name: Check domain cutover
# Read-only: public DNS queries and HTTPS requests from the runner. No secret, no SSH, nothing written on the VPS.
on:
  workflow_dispatch:
    inputs:
      host:
        description: Domaine à vérifier (vide = PRODUCTION_HOST actuel)
        required: false
        type: string
      aliases:
        description: Alias séparés par des virgules (vide = PRODUCTION_ALIASES actuel)
        required: false
        type: string
      phase:
        description: dns = avant de changer PRODUCTION_HOST ; full = après le déploiement sur ce domaine
        required: true
        default: dns
        type: choice
        options: [dns, full]
      mail:
        description: Vérifier aussi SPF, DKIM et DMARC
        required: true
        default: true
        type: boolean
      dkim_selector:
        description: Sélecteur DKIM du service d'emails (Resend = resend)
        required: false
        default: resend
        type: string
      spf_subdomain:
        description: Sous-domaine portant le SPF du service (Resend = send ; vide = domaine principal)
        required: false
        default: send
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check DNS, mail records, HTTPS and redirects
        env:
          CHECK_HOST: ${{ inputs.host || vars.PRODUCTION_HOST }}
          CHECK_ALIASES: ${{ inputs.aliases || vars.PRODUCTION_ALIASES }}
          CHECK_PHASE: ${{ inputs.phase }}
          CHECK_MAIL: ${{ inputs.mail }}
          DKIM_SELECTOR: ${{ inputs.dkim_selector }}
          SPF_SUBDOMAIN: ${{ inputs.spf_subdomain }}
          EXPECTED_IPV4: ${{ vars.VPS_IPV4 }}
          PUBLIC_INDEXING: ${{ vars.PUBLIC_INDEXING || 'false' }}
        run: |
          command -v dig >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils; }
          python3 deploy/cutover_check.py
